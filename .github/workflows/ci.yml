name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # The build must not need real credentials: nothing may connect to the
      # database or Redis at build time. A failure here means something is
      # reaching for a live service during prerender.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://account.harithkavish.com
